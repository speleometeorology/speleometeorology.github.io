<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bat Netting Game | Speleometeorology</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Use the same site styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🦇 Bat Netting</h1>
  <p class="tagline">Click the bats before they escape the cave</p>

  <p>
    <a href="index.html">← Back to main site</a>
  </p>
</header>

<main>

  <section id="game">
    <div id="game-area">
      <div id="score">Score: 0</div>
    </div>
  </section>

</main>

<footer>
  © 2025 Speleometeorology · Cave Games Division
</footer>

<script>
let score = 0;
const gameArea = document.getElementById("game-area");
const scoreDisplay = document.getElementById("score");

function spawnBat() {
  const bat = document.createElement("img");

  // Random bat type
  const types = [
    { src: "games/bat.PNG.png", size: 30, speed: 2 },
    { src: "games/Bat2.png", size: 45, speed: 3 },
   ];
  const type = types[Math.floor(Math.random() * types.length)];

  bat.src = type.src;
  bat.className = "bat";
  bat.style.width = type.size + "px";

  bat.style.top = Math.random() * (gameArea.clientHeight - type.size) + "px";
  bat.style.left = "-50px";

  const speed = type.speed + Math.random(); // slight variation
  gameArea.appendChild(bat);

  let x = -50;
  const fly = setInterval(() => {
    x += speed;
    bat.style.left = x + "px";

    if (x > gameArea.clientWidth) {
      bat.remove();
      clearInterval(fly);
    }
  }, 20);

  bat.addEventListener("click", () => hitBat(bat, fly));
  bat.addEventListener("touchstart", (e) => {
    e.preventDefault();
    hitBat(bat, fly);
  });

  // Optional: flap animation
  bat.style.animation = `flap ${0.2 + Math.random() * 0.2}s infinite ease-in-out`;
}

  function hitBat(bat, fly) {
  score++;
  scoreDisplay.textContent = "Score: " + score;
  bat.remove();
  clearInterval(fly);
}

bat.addEventListener("click", () => hitBat(bat, fly));
bat.addEventListener("touchstart", (e) => {
  e.preventDefault(); // prevents triggering both touch + click
  hitBat(bat, fly);
});


setInterval(spawnBat, 1200);
</script>

</body>
</html>
