<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bat Clicker Game | Speleometeorology</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Use the same site styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🦇 Bat Clicker</h1>
  <p class="tagline">Click the bats before they escape the cave</p>

  <p>
    <a href="index.html">← Back to main site</a>
  </p>
</header>

<main>

  <section id="game">
    <div id="game-area">
      <div id="score">Score: 0</div>
    </div>
  </section>

</main>

<footer>
  © 2025 Speleometeorology · Cave Games Division
</footer>

<script>
let score = 0;
const gameArea = document.getElementById("game-area");
const scoreDisplay = document.getElementById("score");

function spawnBat() {
  const bat = document.createElement("img");
  bat.src = "bat.PNG";
  bat.className = "bat";

  bat.style.top = Math.random() * (gameArea.clientHeight - 40) + "px";
  bat.style.left = "-50px";

  const speed = 2 + Math.random() * 3;

  gameArea.appendChild(bat);

  let x = -50;
  const fly = setInterval(() => {
    x += speed;
    bat.style.left = x + "px";

    if (x > gameArea.clientWidth) {
      bat.remove();
      clearInterval(fly);
    }
  }, 20);

  function hitBat(bat, fly) {
  score++;
  scoreDisplay.textContent = "Score: " + score;
  bat.remove();
  clearInterval(fly);
}

bat.addEventListener("click", () => hitBat(bat, fly));
bat.addEventListener("touchstart", (e) => {
  e.preventDefault(); // prevents triggering both touch + click
  hitBat(bat, fly);
});


setInterval(spawnBat, 1200);
</script>

</body>
</html>
