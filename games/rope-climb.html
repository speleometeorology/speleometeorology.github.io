<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rope Climb | Speleometeorology Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
  <h1>🧗 Rope Climb</h1>
  <p class="tagline">Hit the SPACE bar as fast as you can to climb!</p>
  <p><a href="index.html">← Back to games</a></p>
</header>

<main>
  <section id="rope-game">

    <div id="avatar-select">
  <p><strong>Choose your climber:</strong></p>

  <div class="avatars">
    <div class="avatar" data-color="#ffffff"></div>
    <div class="avatar" data-color="#ff6b6b"></div>
    <div class="avatar" data-color="#4da3ff"></div>
    <div class="avatar" data-color="#51cf66"></div>
    <div class="avatar" data-color="#ffd43b"></div>
  </div>
</div>

    <div id="rope-area">
      <div id="rope"></div>
      <div id="climber"></div>
    </div>

    <p id="height">Height: 0 m</p>
    <p id="instructions">Press <strong>SPACE</strong> repeatedly</p>

  </section>
</main>

<footer>
  © 2025 Speleometeorology · Vertical Edition
</footer>

<script>
const TOP_HEIGHT = 225;
const VISUAL_TOP = 260;

let height = 0;
let selected = false;

const climber = document.getElementById("climber");
const heightDisplay = document.getElementById("height");
const instructions = document.getElementById("instructions");
const avatars = document.querySelectorAll(".avatar");

// Avatar selection
avatars.forEach(avatar => {
  avatar.style.background = avatar.dataset.color;

  avatar.addEventListener("click", () => {
    avatars.forEach(a => a.classList.remove("selected"));
    avatar.classList.add("selected");

    climber.style.background = avatar.dataset.color;
    selected = true;
  });
});

// Rope climbing
document.addEventListener("keydown", (e) => {
  if (!selected) return;

  if (e.code === "Space" && height < TOP_HEIGHT) {
    height++;
    heightDisplay.textContent = "Height: " + height + " ft";

    const climbRatio = height / TOP_HEIGHT;
    climber.style.bottom = (climbRatio * VISUAL_TOP) + "px";

    if (height >= TOP_HEIGHT) {
      instructions.textContent = "🎉 You reached the top!";
      climber.style.background = "#FFD700";
    }
  }
});
</script>


</body>
</html>
