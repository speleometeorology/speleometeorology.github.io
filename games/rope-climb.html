<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rope Climb | Speleometeorology Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
  <h1>🧗 Rope Climb</h1>
  <p class="tagline">Hit the SPACE bar as fast as you can to climb!</p>
  <p><a href="index.html">← Back to games</a></p>
</header>

<main>
  <section id="rope-game">

</div><div id="avatar-select">
  <p><strong>Choose your climber:</strong></p>

  <div class="avatars">
    <div class="avatar" data-name="Riannon" data-img="avatar1.jpg">
      <img src="avatar1.jpg" alt="Riannon">
      <span class="avatar-name">Riannon</span>
    </div>
    <div class="avatar" data-name="Alex" data-img="avatar2.JPG">
      <img src="avatar2.JPG" alt="Alex">
      <span class="avatar-name">Alex</span>
    </div>
    <div class="avatar" data-name="Georgia" data-img="avatar3.png">
      <img src="avatar3.png" alt="Georgia">
      <span class="avatar-name">Georgia</span>
    </div>
    <div class="avatar" data-name="Matt" data-img="avatar4.png">
      <img src="avatar4.png" alt="Matt">
      <span class="avatar-name">Matt</span>
    </div>
    <div class="avatar" data-name="Hunter" data-img="avatar5.png">
      <img src="avatar5.png" alt="Hunter">
      <span class="avatar-name">Hunter</span>
    </div>
  </div>
</div>


    <div id="rope-area">
      <div id="rope"></div>
      <div id="climber"></div>
    </div>

    <p id="height">Height: 0 ft</p>
    <p id="instructions">Press <strong>SPACE</strong> repeatedly</p>

  </section>
</main>

<footer>
  © 2025 Speleometeorology · Vertical Edition
</footer>

<script>
const TOP_HEIGHT = 225;
const VISUAL_TOP = 280;

let height = 0;
let selected = false;

const climber = document.getElementById("climber");
const heightDisplay = document.getElementById("height");
const instructions = document.getElementById("instructions");
const avatars = document.querySelectorAll(".avatar");

// Avatar selection
avatars.forEach(avatar => {
  avatar.addEventListener("click", () => {
    avatars.forEach(a => a.classList.remove("selected"));
    avatar.classList.add("selected");

    // Use the avatar photo for the climber
    climber.style.background = "url('" + avatar.dataset.img + "')";
    climber.style.backgroundSize = "cover";
    climber.style.backgroundPosition = "center";

    selected = true;
    instructions.textContent = "Press SPACE repeatedly to climb!";
  });
});

// Rope climbing
document.addEventListener("keydown", (e) => {
  if (!selected) return;

  if (e.code === "Space" && height < TOP_HEIGHT) {
    height++;
    heightDisplay.textContent = "Height: " + height + " ft";

    const climbRatio = height / TOP_HEIGHT;
    climber.style.bottom = (climbRatio * VISUAL_TOP) + "px";

    if (height >= TOP_HEIGHT) {
      instructions.textContent = "🎉 You reached the top!";
      climber.style.background = "#FFD700";
    }
  }
});
</script>


</body>
</html>
