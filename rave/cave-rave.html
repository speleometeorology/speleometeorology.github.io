<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cave Rave</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="rave.css">

  <style>
    body {
      overflow: hidden;
      background: radial-gradient(circle at center, #111 0%, #000 70%);
    }

    .photo {
      position: absolute;
      width: 120px;
      border-radius: 12px;
      animation: dance linear infinite;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    @keyframes dance {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }
      25% {
        transform: translate(50px, -40px) rotate(10deg);
      }
      50% {
        transform: translate(-40px, 30px) rotate(-10deg);
      }
      75% {
        transform: translate(30px, 50px) rotate(8deg);
      }
      100% {
        transform: translate(0, 0) rotate(0deg);
      }
    }

    .top-bar {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
    }
  </style>
</head>

<body>

<div class="top-bar">
  <p><a href="/index.html">← Back to main site</a></p>
</div>

<img src="Crk1.png" class="jumper">
<img src="Crk2.png" class="jumper">  
<img src="rainbow-cave.JPEG">
  
<script>
const images = [
  "Bat2.png",
  "bat.PNG"
];

for (let i = 0; i < 12; i++) {
  const img = document.createElement("img");
  img.src = images[i % images.length];
  img.className = "photo";

  img.style.top = Math.random() * window.innerHeight + "px";
  img.style.left = Math.random() * window.innerWidth + "px";

  img.style.animationDuration = (4 + Math.random() * 6) + "s";

  document.body.appendChild(img);
}
</script>

<script>
const jumpers = document.querySelectorAll(".jumper");

function jumpImages() {
  jumpers.forEach(img => {
    const size = img.offsetWidth;
    const maxX = window.innerWidth - size;
    const maxY = window.innerHeight - size;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    const r = Math.random() * 360;

    img.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg)`;
  });
}

// Initial jump
jumpImages();

// Jump repeatedly
setInterval(jumpImages, 600);

// Recalculate on rotation / resize
window.addEventListener("resize", jumpImages);
window.addEventListener("orientationchange", jumpImages);
</script>

  
</body>
</html>
